[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlarena-sdk"
version = "4.6.0"
description = "Python SDK for ML Arena - make submissions, manage challenges, courses, and view leaderboards"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "ML Arena", email = "contact@ml-arena.com"},
]
keywords = ["machine-learning", "reinforcement-learning", "challenges", "sdk", "ml-arena"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32.0",
    # mlarena.local reads challenge.toml; tomllib is stdlib from 3.11.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pandas = ["pandas>=1.0.0"]
# mlarena.local.record_render: replay.mp4 from start_render_video (the
# platform's H.264 profile) through imageio-ffmpeg's bundled ffmpeg.
video = ["imageio-ffmpeg>=0.6,<0.7", "pillow>=10.2.0"]

[project.urls]
Homepage = "https://ml-arena.com"
Documentation = "https://ml-arena.com/docs"
Repository = "https://github.com/ml-arena/mlarena-sdk"
"Bug Tracker" = "https://github.com/ml-arena/mlarena-sdk/issues"

[tool.setuptools.packages.find]
include = ["mlarena*"]
